work_domain: enterprise_customer_support
schema_version: "0.4"
last_updated: null
owner: "product-team"
confidence: "medium"

# Boundary evidence is validated against a specific system. Pin the versions;
# any change here is a refresh trigger: affected boundaries are unvalidated
# until required evals re-run.
system_dependencies:
  model_version: "pinned-model-id"
  prompt_version: "prompts@git-sha-or-tag"
  tool_versions: ["ticketing-api@2.3"]
  retrieval_corpus_version: "kb-snapshot-2026-07-01"
  revalidation_rule: "re-run required evals before boundary states persist"

evidence_policy:
  missing_evidence_label_means: "unvalidated"
  ai_may_use_unvalidated_claims_as: "hypothesis_only"

current_work_architecture:
  sequence: "Ticket read, investigated, drafted, reviewed, sent."
  queues: "Escalations wait for support lead or product engineer."
  handoffs: "Support sends narrative to engineering."
  reviews: "Agent manually reviews most responses."
  approvals: "High-risk cases require lead approval."
  artifacts: "Ticket thread, macros, internal notes."
  feedback_loops: "Knowledge updates happen after the case."
  control_surfaces: ["manual_review", "lead_escalation"]
  metrics: ["resolution_time", "csat", "reopen_rate"]

ai_native_work_architecture_hypothesis:
  sequence: "Context prepared automatically before response work starts."
  queues: "Low-risk cases resolved; uncertain cases routed with evidence."
  handoffs: "AI prepares structured evidence packet for engineering."
  reviews: "Humans review high-risk or low-confidence responses."
  approvals: "Approval gates based on risk, policy, and confidence."
  artifacts: "Living case object with evidence, decisions, status."
  feedback_loops: "Lessons proposed during resolution."
  control_surfaces: ["approval_gate", "confidence_threshold", "policy_block", "rollback"]
  metrics: ["draft_acceptance_rate", "edit_distance", "source_inspection_rate", "reopen_rate"]

responsibilities:
  - name: "draft_response"
    current_human_owner: "support_agent"
    boundary:
      current_state: "AI-assisted"
      target_state: "AI-assisted"
      ai_role: "draft policy-checked response"
      movement_condition: ["response_correctness_eval_passes", "policy_compliance_eval_passes", "source_fidelity_visible"]
      accountability_owner: "support_lead"
      # Control stacks apply only to AI-executed states, and they compose
      # (e.g. ["policy-governed", "rollback-required"]). Both states here are
      # AI-assisted, so both stacks are empty.
      current_controls: []
      target_controls: []
    product_requirements: ["policy_checked_drafts", "source_citations", "approval_gate"]
    eval_requirements: ["response_correctness_eval", "policy_compliance_eval", "source_fidelity_eval"]
    telemetry: ["draft_acceptance_rate", "edit_distance", "reopen_rate", "escalation_rate"]
    claims:
      - claim: "Draft response can remain AI-assisted for low-risk cases."
        evidence_label: "unvalidated"
        confidence: "low"
        allowed_agent_use: "hypothesis_only"
        validation_needed: true

contradictions:
  - date: null
    assumption_challenged: "Support agents will trust source-backed drafts."
    signal: "High edit distance or low source inspection."
    what_we_learned: null
    map_update: null
    product_eval_impact: "May require better source UI or lower target boundary."
    status: "open"

# Each gate check carries a status and evidence. The validator refuses
# decision "move" while any check is "fail" or any "not_applicable" lacks
# an evidence note; "move" and "do_not_move" also require a signed decision
# record below. Gate presence is not gate success.
release_gate:
  boundary_or_shift: "draft_response"
  capability:
    - check: "capability_demonstrated_in_realistic_scenarios_including_subgroups"
      status: "fail"
      evidence: null
    - check: "known_limitations_documented"
      status: "pass"
      evidence: "limitations-doc@v3"
    - check: "failure_modes_understood"
      status: "fail"
      evidence: null
  trust_and_evidence:
    - check: "evidence_inspectable"
      status: "pass"
      evidence: "source-citation-ui-review-2026-06"
    - check: "calibration_or_uncertainty_visible"
      status: "fail"
      evidence: null
    - check: "human_control_appropriate"
      status: "pass"
      evidence: "approval-gate-design-doc"
  accountability:
    - check: "accountable_owner_explicit"
      status: "pass"
      evidence: "support_lead named in map"
    - check: "human_only_decisions_preserved"
      status: "pass"
      evidence: "customer send stays human"
    - check: "escalation_path_exists"
      status: "pass"
      evidence: "lead-escalation runbook"
  oversight_viability:
    - check: "review_capacity_budgeted_at_peak_with_detection_target"
      status: "fail"
      evidence: null
    - check: "accountable_owner_has_authority_information_time_skill"
      status: "fail"
      evidence: null
    - check: "independent_challenge_and_recourse_for_high_impact_moves"
      status: "not_applicable"
      evidence: "draft_response stays AI-assisted; low-impact move"
    - check: "skill_retention_plan_where_practice_erodes"
      status: "fail"
      evidence: null
    - check: "ai_only_paths_enumerated_with_hazard_commensurate_controls"
      status: "not_applicable"
      evidence: "no AI-executed boundary in this map"
  evals:
    - check: "required_evals_defined"
      status: "pass"
      evidence: "eval_requirements in this map"
    - check: "required_evals_pass"
      status: "fail"
      evidence: null
    - check: "regression_coverage_exists"
      status: "fail"
      evidence: null
  telemetry:
    - check: "adoption_measurable"
      status: "pass"
      evidence: "draft_acceptance_rate dashboard"
    - check: "overrides_measurable"
      status: "pass"
      evidence: "edit_distance dashboard"
    - check: "misuse_measurable"
      status: "fail"
      evidence: null
    - check: "rejection_or_abandonment_measurable"
      status: "fail"
      evidence: null
    - check: "drift_or_degradation_detectable"
      status: "fail"
      evidence: null
  decision: "validate_further"  # one of: move / do_not_move / validate_further

# Sequences of AI-executed steps a work item can traverse with no human contact.
# Empty is a claim, not a default: enumerate after any move creates or extends a
# chain. Each entry needs a hazard_class and typed controls; the validator
# rejects irreversible paths whose controls are detective-only.
ai_only_paths: []

# One entry per decision; the validator requires a signed record whenever the
# release gate decides "move" or "do_not_move". Full narrative goes in a
# Boundary Decision Record (references/templates.md); link it via `record`.
decision_records: []

durable_ambiguity:
  uncertainty_status: "active"
  multiple_hypotheses:
    - id: "H1"
      hypothesis: "Low-risk support cases move to risk-based review."
      what_changes: "Risk-scored cases bypass human review for low-risk responses; humans focus on high-risk and exceptions."
      evidence_needed:
        - "draft_acceptance_rate"
        - "reopen_rate"
        - "policy_violation_rate"
      risk: "overtrust_in_ai_drafts"
      option_preserving_next_step: "pilot_with_human_approval_required"
  option_preserving_rules:
    - "prefer_reversible_changes"
    - "preserve_human_override"
    - "stage_delegation"
    - "define_contradiction_signals"
  contradiction_signals:
    - "high_override_rate"
    - "high_reopen_rate"
    - "low_source_inspection"
    - "new_manual_workarounds"
